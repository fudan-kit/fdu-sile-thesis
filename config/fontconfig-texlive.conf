<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Keep the normal system font configuration and expose the OpenType
       families shipped by TeX Live so SILE and fduthesis-2026 use the same
       glyph outlines and metrics. -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/usr/share/texlive/texmf-dist/fonts/opentype/public/fandol</dir>
  <dir>/usr/share/texlive/texmf-dist/fonts/opentype/public/xits</dir>
  <dir>/usr/share/texlive/texmf-dist/fonts/opentype/public/tex-gyre</dir>

  <!-- The Fandol OTF files shipped by TeX Live 2025 expose the same numeric
       fontconfig weight for their Regular and Bold faces.  Family matching
       consequently picks the Bold file even when SILE asks for weight 400.
       Correct the scan results locally so normal thesis text uses the same
       outlines as XeLaTeX while explicit bold text still selects Bold. -->
  <match target="scan">
    <test name="family" compare="eq"><string>FandolSong</string></test>
    <test name="style" compare="eq"><string>Regular</string></test>
    <edit name="weight" mode="assign"><const>regular</const></edit>
  </match>
  <match target="scan">
    <test name="family" compare="eq"><string>FandolSong</string></test>
    <test name="style" compare="eq"><string>Bold</string></test>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
  <match target="scan">
    <test name="family" compare="eq"><string>FandolHei</string></test>
    <test name="style" compare="eq"><string>Regular</string></test>
    <edit name="weight" mode="assign"><const>regular</const></edit>
  </match>
  <match target="scan">
    <test name="family" compare="eq"><string>FandolHei</string></test>
    <test name="style" compare="eq"><string>Bold</string></test>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
</fontconfig>
